name: Update Tier List

on:
  # Dual schedule to handle Pacific Daylight/Standard Time transitions, so the
  # first attempt always lands at ~2:23 AM Pacific whatever the season.
  #
  # Two things about these times are deliberate:
  #
  #   * The minute is :23, not :02. Scheduled events are best-effort and queue
  #     behind every other cron on the platform; the top of the hour is the
  #     most congested slot there is. Every run this repo has ever had started
  #     late — 35 minutes on a good week, 3h51m on 2026-06-17 — and on
  #     2026-09-02 the trigger was dropped outright, with no run recorded.
  #
  #   * Each season has a second, later cron as a safety net for exactly that
  #     dropped-trigger case. The job is idempotent — it commits and deploys
  #     only when a file in GENERATED_PATHS actually changed — so on a week the
  #     first attempt worked, the backup costs a couple of CI minutes and logs
  #     "already up to date". The concurrency group on the job below keeps the
  #     two from racing if the first one is merely running very late.
  schedule:
    # PDT (March-early November): 9:23 AM UTC = 2:23 AM PDT (UTC-7)
    - cron: '23 9 * 3-10 3'
    # PDT backup, three hours later: 12:23 PM UTC = 5:23 AM PDT
    - cron: '23 12 * 3-10 3'
    # PST (early November-February): 10:23 AM UTC = 2:23 AM PST (UTC-8)
    - cron: '23 10 * 11-12,1-2 3'
    # PST backup, three hours later: 1:23 PM UTC = 5:23 AM PST
    - cron: '23 13 * 11-12,1-2 3'
  
  # Allow manual triggering for testing
  workflow_dispatch:
    inputs:
      debug:
        description: 'Enable debug mode'
        required: false
        default: 'false'
        type: boolean
      force_deploy:
        description: 'Rebuild and deploy even if nothing changed (use to recover a missed week)'
        required: false
        default: false
        type: boolean

jobs:
  update-tierlist:
    runs-on: ubuntu-latest

    # The backup cron can collide with a first attempt that GitHub started
    # hours late. Both runs would generate the same files and then race on the
    # push, so the later one waits for the in-flight run to finish rather than
    # running alongside it — by which point it finds nothing changed and exits.
    concurrency:
      group: update-tierlist
      cancel-in-progress: false

    env:
      # Every path the pipeline writes, in one place. The change check and the
      # commit step both read it, so they can't drift apart: a generated file
      # missing from this list stays unstaged after the commit, and
      # `git pull --rebase` then refuses to run on a dirty worktree — which is
      # exactly how the 2026-08-05 run lost the Pathogenic update.
      GENERATED_PATHS: >-
        public/tierlist.png
        public/episodes.json
        public/episode-art
        public/episode-share
        public/sitemap.xml
        public/brand
        public/blog
        public/blog-index.json
        scripts/steam_images
        scripts/sitemap-lastmod.json

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        # Important: This allows the action to push changes back
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r scripts/requirements.txt
    
    - name: Update tier list
      env:
        # This is the secure way to pass the Google credentials
        GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      run: |
        cd scripts
        if [ "${{ github.event.inputs.debug }}" = "true" ]; then
          python automated_tierlist_updater.py --debug --verbose
        else
          python automated_tierlist_updater.py --verbose
        fi
    
    - name: Refresh episode data
      # Snapshots the RSS feed, then exports the card art and social share cards
      # from the Steam capsule cache the tier list step just updated. Never
      # fatal: the site falls back to the committed snapshot.
      continue-on-error: true
      run: |
        node scripts/fetch-episodes.js
        python scripts/export_episode_art.py
        python scripts/export_share_cards.py
        # Re-run so newly exported art/cards are referenced in episodes.json.
        node scripts/fetch-episodes.js
        # Regenerate here too, so the committed copies match what gets deployed.
        # Both run again inside `npm run build` below, but that's after the
        # commit — anything they write there would ship without being committed.
        node scripts/generate-blog-index.js
        node scripts/generate-sitemap.js

    - name: Check for changes
      id: check_changes
      run: |
        echo "Working tree after the refresh:"
        git status --porcelain
        # `git status --porcelain`, not `git diff HEAD`: a brand-new episode's
        # art and share card are *untracked*, and git diff never sees those.
        if [ -n "$(git status --porcelain -- $GENERATED_PATHS)" ]; then
          echo "changed=true" >> $GITHUB_OUTPUT
          echo "Generated files changed — will commit and deploy"
        else
          echo "changed=false" >> $GITHUB_OUTPUT
          echo "Nothing changed — tier list and episode data are already up to date"
        fi
        # Reported separately so the summary can tell "new game on the tier
        # list" apart from "only the episode list moved".
        if git diff --quiet HEAD -- public/tierlist.png; then
          echo "tierlist_changed=false" >> $GITHUB_OUTPUT
        else
          echo "tierlist_changed=true" >> $GITHUB_OUTPUT
        fi

    - name: Commit and push changes
      if: steps.check_changes.outputs.changed == 'true'
      run: |
        set -euo pipefail
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

        # -A so new episode art/share cards (untracked) and any removals are
        # staged too, not just modifications to files git already knows about.
        git add -A -- $GENERATED_PATHS
        git commit -m "🎮 Automated tier list update - $(date +'%Y-%m-%d %H:%M UTC')"

        # Anything the pipeline wrote that isn't in GENERATED_PATHS would be
        # left behind here. --autostash keeps that from aborting the rebase,
        # but it still means the list needs updating, so say so loudly.
        leftover="$(git status --porcelain)"
        if [ -n "$leftover" ]; then
          echo "::warning::Unstaged files left after commit — add them to GENERATED_PATHS:"
          echo "$leftover"
        fi

        # Rebase onto whatever landed on main while this run was working.
        # --autostash so a stray dirty file can never abort the push again.
        git pull --rebase --autostash origin main

        pushed=false
        for attempt in 1 2 3; do
          if git push origin HEAD:main; then
            pushed=true
            break
          fi
          echo "Push failed (attempt $attempt of 3), rebasing and retrying"
          sleep 2
          # Non-fatal under `set -e`, so a failed rebase still reaches the
          # explicit error below rather than exiting the step unexplained.
          if ! git pull --rebase --autostash origin main; then
            echo "Rebase onto origin/main failed"
            git rebase --abort || true
            break
          fi
        done

        if [ "$pushed" != "true" ]; then
          echo "::error::Failed to push after 3 attempts"
          exit 1
        fi

    - name: Build website
      if: steps.check_changes.outputs.changed == 'true' || inputs.force_deploy
      run: |
        npm install
        npm run build

    - name: Deploy to GitHub Pages
      if: steps.check_changes.outputs.changed == 'true' || inputs.force_deploy
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./build
    
    # always(), so a run that dies partway through still explains itself in the
    # summary instead of leaving a bare red X nobody notices until the next
    # episode drops.
    - name: Create summary
      if: always()
      run: |
        echo "## 🎮 Tier List Update Results" >> $GITHUB_STEP_SUMMARY
        echo "- **Timestamp:** $(date +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
        if [ "${{ job.status }}" != "success" ]; then
          echo "- **Status:** ❌ Run failed — the tier list on the site is unchanged" >> $GITHUB_STEP_SUMMARY
          echo "- **Action:** Check the failed step above, then re-run this workflow" >> $GITHUB_STEP_SUMMARY
          echo "  from the Actions tab (tick **force_deploy** if the files were" >> $GITHUB_STEP_SUMMARY
          echo "  already committed but never deployed)." >> $GITHUB_STEP_SUMMARY
        elif [ "${{ steps.check_changes.outputs.changed }}" = "true" ]; then
          echo "- **Status:** ✅ Committed and deployed" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check_changes.outputs.tierlist_changed }}" = "true" ]; then
            echo "- **Tier list image:** updated" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Tier list image:** unchanged (episode data refreshed only)" >> $GITHUB_STEP_SUMMARY
          fi
        elif [ "${{ inputs.force_deploy }}" = "true" ]; then
          echo "- **Status:** ✅ Nothing changed, redeployed anyway (force_deploy)" >> $GITHUB_STEP_SUMMARY
        else
          echo "- **Status:** ℹ️ No changes needed" >> $GITHUB_STEP_SUMMARY
          echo "- **Action:** Tier list and episode data are already up to date" >> $GITHUB_STEP_SUMMARY
          echo "  (if an episode just dropped, check it's on an \`X Tier:\` line" >> $GITHUB_STEP_SUMMARY
          echo "  in the Google Doc — see the warning above, if any)." >> $GITHUB_STEP_SUMMARY
        fi
        echo "- **Manual trigger:** Available in Actions tab" >> $GITHUB_STEP_SUMMARY